# Supabase's free plan pauses a project after a week without activity.
# This makes one tiny database request every 3 days so logins keep working.
# (Not needed if you upgrade Supabase to Pro.)
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 14 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]*' src/config.js)
          KEY=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]*' src/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not set up yet; skipping."; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/invite_info" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIVE"}'
